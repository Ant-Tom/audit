<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Обратный звонок</title></head>
<body>
<div class="b-search"><input type="search" name="q" placeholder="Поиск"></div>
<div class="callback-widget">
  <div class="callback-widget__title">Заказать обратный звонок</div>
  <div class="row"><input type="text" name="NAME" placeholder="Имя"></div>
  <div class="row"><input type="text" name="PHONE" placeholder="Телефон"></div>
  <div class="row agreement">
    <input type="checkbox" name="AGREE">
    <span>Нажимая кнопку, я принимаю условия <a href="https://shop.example/oferta/">оферты</a></span>
  </div>
  <div class="btn btn-primary js-callback-send">Перезвоните мне</div>
</div>
</body>
</html>
