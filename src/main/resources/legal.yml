# Нормы права, на которые ссылаются находки отчёта. Ключ записи = Finding.legalRef.
# В коде правил нет ни статей, ни сумм — всё только здесь.
#
# ВНИМАНИЕ: записи заполнены по памяти и НЕ проверены юристом.
# Каждая запись помечена verifiedAt: null и # TODO: verify. После проверки проставьте дату (YYYY-MM-DD).
# Пока verifiedAt пустой, отчёт помечает сведения о норме как «требуют уточнения».
#
# Поля:
#   title            — коротко, о чём требование (для владельца бизнеса)
#   article          — статья закона, где установлено требование
#   summary          — суть требования простыми словами
#   liability        — статья об ответственности
#   fineLegalEntity  — штраф для юридических лиц (как текст: диапазон, повторность)
#   verifiedAt       — дата ручной проверки или null

legal:
  norms:
    pd-policy-publication:  # TODO: verify
      title: "Публикация политики обработки персональных данных"
      article: "ч. 2 ст. 18.1 Федерального закона от 27.07.2006 № 152-ФЗ «О персональных данных»"
      summary: "Оператор, который собирает персональные данные через сайт, обязан опубликовать на этом сайте документ о своей политике в отношении обработки персональных данных и обеспечить к нему неограниченный доступ."
      liability: "ч. 3 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 60 000 руб."
      verifiedAt: null

    pd-policy-content:  # TODO: verify
      title: "Содержание политики обработки персональных данных"
      article: "ст. 18.1 152-ФЗ; ст. 5, 9, 14 152-ФЗ; Рекомендации Роскомнадзора по составлению политики"
      summary: "Из политики должно быть понятно, кто оператор, какие данные, для каких целей и как долго он обрабатывает, какие права есть у субъекта и как отозвать согласие."
      liability: "ч. 3 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 60 000 руб."
      verifiedAt: null

    pd-consent-required:  # TODO: verify
      title: "Согласие на обработку персональных данных"
      article: "ст. 6, ст. 9 152-ФЗ"
      summary: "Если для обработки нет иного законного основания, нужно согласие субъекта — конкретное, предметное, информированное, сознательное и однозначное."
      liability: "ч. 2 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 150 000 руб.; повторно (ч. 2.1) — от 300 000 до 500 000 руб."
      verifiedAt: null

    pd-consent-form:  # TODO: verify
      title: "Согласие должно быть сознательным и однозначным"
      article: "ч. 1 ст. 9 152-ФЗ"
      summary: "Согласие даётся свободно, своей волей и в своём интересе; заранее проставленная отметка может не считаться сознательным и однозначным согласием."
      liability: "ч. 2 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 150 000 руб.; повторно (ч. 2.1) — от 300 000 до 500 000 руб."
      verifiedAt: null

    pd-consent-separate:  # TODO: verify
      title: "Согласие оформляется отдельно от других документов"
      article: "ч. 1 ст. 9 152-ФЗ в ред. Федерального закона от 24.06.2025 № 156-ФЗ (действует с 01.09.2025)"
      summary: "Согласие на обработку персональных данных должно оформляться отдельно от иных информации и документов, которые подтверждает или подписывает субъект (оферты, пользовательского соглашения, политики)."
      liability: "ч. 2 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 150 000 руб.; повторно (ч. 2.1) — от 300 000 до 500 000 руб."
      verifiedAt: null

    pd-cookies:  # TODO: verify
      title: "Cookie и данные о посещениях"
      article: "п. 1 ст. 3, ст. 6, ст. 9 152-ФЗ; позиция Роскомнадзора о cookie"
      summary: "Прямого требования «показывать cookie-баннер» в законе нет. Но cookie и сведения о посещениях вместе с другими данными могут относиться к персональным данным; тогда для их обработки нужно законное основание, чаще всего согласие, и посетителя нужно об этом проинформировать."
      liability: "ч. 1 или ч. 2 ст. 13.11 КоАП РФ — в зависимости от обстоятельств"
      fineLegalEntity: null
      verifiedAt: null

    pd-trackers-consent:  # TODO: verify
      title: "Счётчики и пиксели до получения согласия"
      article: "ст. 6, ст. 9 152-ФЗ"
      summary: "Если сервис аналитики или рекламы получает данные о посетителе (cookie, идентификаторы, IP-адрес) и это персональные данные, их обработка требует законного основания — обычно согласия, полученного до начала обработки."
      liability: "ч. 2 ст. 13.11 КоАП РФ"
      fineLegalEntity: "от 30 000 до 150 000 руб.; повторно (ч. 2.1) — от 300 000 до 500 000 руб."
      verifiedAt: null

    pd-cross-border:  # TODO: verify
      title: "Трансграничная передача персональных данных"
      article: "ст. 12 152-ФЗ (уведомление Роскомнадзора о трансграничной передаче — ч. 3 ст. 12); ч. 5 ст. 18 152-ФЗ (локализация баз данных)"
      summary: "До начала передачи персональных данных за рубеж оператор обязан уведомить Роскомнадзор. Сбор персональных данных граждан РФ должен вестись с использованием баз данных, находящихся в РФ."
      liability: "ст. 13.11 КоАП РФ (ч. 8, 9 — локализация); ответственность за отсутствие уведомления — уточнить"
      fineLegalEntity: null
      verifiedAt: null

    pd-security:  # TODO: verify
      title: "Защита персональных данных при передаче"
      article: "ст. 19 152-ФЗ"
      summary: "Оператор обязан принимать необходимые правовые, организационные и технические меры для защиты персональных данных от неправомерного доступа. Передача данных формы по незашифрованному каналу (HTTP) — признак того, что такие меры могут быть недостаточны."
      liability: "ст. 13.11 КоАП РФ — в зависимости от последствий (в том числе ч. 12–18 при утечке)"
      fineLegalEntity: null
      verifiedAt: null

    ad-marking:  # TODO: verify
      title: "Маркировка интернет-рекламы"
      article: "ст. 18.1 Федерального закона от 13.03.2006 № 38-ФЗ «О рекламе»"
      summary: "Интернет-реклама должна иметь пометку «Реклама», сведения о рекламодателе и идентификатор рекламы (токен erid)."
      liability: "ст. 14.3 КоАП РФ (часть — уточнить)"
      fineLegalEntity: null
      verifiedAt: null
